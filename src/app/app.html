<h3>User List</h3>

<input type="text" placeholder="Enter name" [value]="name()" (input)="name.set($event.target.value)">

<input type="email" placeholder="Enter email" [value]="email()" (input)="email.set($event.target.value)">


<button (click)="submitForm()" >{{editingUpdateId() ? 'Update User' : 'Add User'}}</button>

<hr>

<h2>User List</h2>
<ul>
    @for (user of users() ; track user.id!){
        <li>{{user.name}} - {{user.email}} - {{user.isActive}}</li>
        <button (click)="editUser(user)">Edit User</button>
    }
</ul>
