
<input [(ngModel)]="username" placeholder="Enter Your Name"/>

<p>{{username}}</p>


<input [value]="name()" (input)="name.set($event.target.value)" placeholder="Enter Your Name">

<p>{{name()}}</p>



<input [value]="user().name" (input)="updateName($event.target.value)" placeholder="Enter Your Name">
<br><br>
<p>Updated Name: {{user().name}}</p>
<hr>

<p>Age: {{user().age}}</p>
<button (click)="updateAge()">Increase Age</button>
