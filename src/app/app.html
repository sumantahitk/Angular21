@for (item of items ; track $index){
    <p>index- {{$index}} Value- {{item}}</p>
}


@for(u of users;track $index ){
    <div>
        <h4>{{u.name}}</h4>
        <p>Age: {{u.age}}</p>
    </div>
}


@for (item of items ; track $index ; let i=$index){
    <p>{{item}}</p>
    <button (click)="removeItem(i)">Delete</button>
}

@for(i of num ;track $index){
    @if(i%2==0){
        <p>{{i}}: Even number</p>
    }@else{
         <p>{{i}}: Odd number</p>
    }
}
