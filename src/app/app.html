<form (submit)="setTask(taskInput.value); taskInput.value=''; $event.preventDefault()">
    
  <input #taskInput placeholder="Write Your Task">
  
  <button type="submit">Add</button>

</form>

@if(arr().length > 0) {
  @for(item of arr(); track $index; let i=$index) {
   <div class="row">
     <p>{{i+1}}.         {{ item }}</p>
     <button (click)="removeItem(i)">Delete</button>
   </div>
  }
}
